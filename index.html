<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeScript â€” Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: #050510;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: #F9FAFB;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body {
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(124,58,237,0.18), transparent 70%),
      radial-gradient(900px 500px at 100% 30%, rgba(244,63,94,0.06), transparent 70%),
      #050510;
    background-attachment: fixed;
  }
  #root { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 32px 16px; box-sizing: border-box; }
  *::-webkit-scrollbar { width: 0; display: none; }
  * { scrollbar-width: none; }
  button { font-family: inherit; }
  @keyframes ls-pulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.08); opacity: 1; } }
  @keyframes ls-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes ls-twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  @keyframes ls-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes ls-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes ls-fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes ls-fadein-r { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  .ls-fade   { animation: ls-fadein 0.35s ease both; }
  .ls-fade-r { animation: ls-fadein-r 0.35s ease both; }
  @keyframes ls-glow { 0%, 100% { box-shadow: 0 0 24px rgba(124,58,237,0.4); } 50% { box-shadow: 0 0 36px rgba(124,58,237,0.7); } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel" src="clan.jsx"></script>
<script type="text/babel" src="extras.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
const LS_QUESTIONS = [
  { id: 'name', title: 'Como te deves chamar?', hint: 'Vou usar o teu nome.' },
  { id: 'dream', title: 'Qual é o teu maior sonho?', hint: 'Sê ousado.' },
  { id: 'obstacle', title: 'O que te impede?', hint: 'Nomear o obstáculo reduz o seu tamanho.' },
  { id: 'focus', title: 'Onde queres crescer primeiro?', hint: 'A âncora da tua constelação.' }
];

window.Onboarding = function({ onComplete }) {
  const [step, setStep] = React.useState(0);
  const [data, setData] = React.useState({});
  const q = LS_QUESTIONS[step];

  const handleNext = () => {
    if (step < LS_QUESTIONS.length - 1) setStep(step + 1);
    else if (onComplete) onComplete(data);
  };

  return (
    <div className="ls-fade" style={{ position: 'fixed', top: 0, left: 0, width: '100vw', height: '100vh', display: 'flex', flexDirection: 'column', padding: '40px 24px', boxSizing: 'border-box', background: '#050510', zIndex: 9999 }}>
      
      {/* Símbolo Exclusivo e Limpo */}
      <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '40px' }}>
        <div style={{ width: '60px', height: '60px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(124,58,237,0.8) 0%, rgba(59,7,100,1) 100%)', animation: 'ls-glow 3s infinite', boxShadow: '0 0 20px rgba(124,58,237,0.5)' }}></div>
      </div>

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', maxWidth: '600px', margin: '0 auto', width: '100%' }}>
        <p style={{ color: '#A78BFA', fontSize: '13px', textTransform: 'uppercase', letterSpacing: '1.5px', marginBottom: '12px', fontWeight: '600' }}>{q.hint}</p>
        <h2 style={{ fontSize: '32px', fontWeight: '800', margin: '0 0 32px 0', lineHeight: '1.2', color: '#F9FAFB' }}>{q.title}</h2>
        <input autoFocus type="text" placeholder="A tua resposta..." value={data[q.id] || ''} onChange={e => setData({ ...data, [q.id]: e.target.value })} style={{ width: '100%', padding: '20px', borderRadius: '16px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', color: '#fff', fontSize: '18px', boxSizing: 'border-box', outline: 'none' }} />
      </div>

      <div style={{ display: 'flex', justifyContent: 'center', marginTop: '40px' }}>
        <button onClick={handleNext} style={{ width: '100%', maxWidth: '600px', padding: '20px', borderRadius: '30px', background: 'linear-gradient(135deg, #7C3AED, #5B21B6)', color: '#fff', border: 'none', fontSize: '16px', fontWeight: '700', cursor: 'pointer', boxShadow: '0 8px 20px rgba(124,58,237,0.3)' }}>
          {step === LS_QUESTIONS.length - 1 ? 'Gerar o meu LifeScript' : 'Continuar'}
        </button>
      </div>
    </div>
  );
};
</script>
</body>
</html>
